# Source of truth for the Xcode project. Regenerate with: xcodegen generate
# Do NOT hand-edit FusionTakeoff.xcodeproj — edit this file instead.
name: FusionTakeoff
options:
  bundleIdPrefix: com.takeoff
  deploymentTarget:
    # macOS 14 and later: the newest APIs (Liquid Glass, Foundation Models) are used only
    # behind availability checks, so the app still runs on older Macs.
    macOS: "14.0"
  # Italian is the UI language written in the code: it is the source of the String Catalog,
  # and the fallback when a translation is missing (docs/UI_LIQUID_GLASS_AND_I18N_SPEC.md).
  developmentLanguage: it
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Written by .githooks/pre-commit at every commit: major.minor stay as set here, the last
    # number counts the commits since the series began (also stamped into the built app).
    # New series (Ross, 27/09: 1.0.0 with «Circuiti»): set major.minor here and FTK_SERIES_START
    # to the commit count the series' first commit will have (git rev-list --count HEAD + 1).
    MARKETING_VERSION: "1.0.114"
    FTK_SERIES_START: "164"
    CURRENT_PROJECT_VERSION: "1"
    # Signed with the team in Config/Local.xcconfig (not versioned): `xcodegen generate` rewrites
    # the .xcodeproj at every build, so a team chosen in Xcode's UI would be reverted each time.
    # Put your team there — DEVELOPMENT_TEAM = XXXXXXXXXX — and it survives regeneration.
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode's recommended settings (30/10): drop unused code from the release binaries, and let
    # the static analyzer flag user-visible strings that skip Localizable.xcstrings.
    DEAD_CODE_STRIPPING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
# Signing settings live in Config/Signing.xcconfig (which optionally includes the untracked
# Config/Local.xcconfig with the team), so they are not part of the generated project.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  CADCore:
    path: Packages/CADCore
  # «Circuiti»: the electronics engine (Codex, docs/electronics).
  ElectronicsCore:
    path: Packages/ElectronicsCore
targets:
  FusionTakeoff:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: CADCore
      - package: ElectronicsCore
        product: ElectronicsCore
      # MCP bridge shipped inside the app: Contents/MacOS/ftk-mcp (Claude Desktop, ChatGPT tunnel).
      - target: ftk-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CAD Takeoff
        CFBundleName: CAD Takeoff
        # Version and build come from the build settings (the archive script sets the build number).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.graphics-design
        # Only standard HTTPS (Anthropic/OpenAI APIs) and a localhost MCP server: exempt.
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 CAD Takeoff"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.takeoff.fusiontakeoff.design
            UTTypeDescription: CAD Takeoff Design
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [ftk]
          - UTTypeIdentifier: com.takeoff.fusiontakeoff.circuit
            UTTypeDescription: CAD Takeoff Circuito
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [ftkc]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takeoff.fusiontakeoff
        CODE_SIGN_ENTITLEMENTS: App/FusionTakeoff.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Recommended settings (30/10), set on the target too so Xcode's check stays quiet.
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        # NOT enabled: String Catalog Symbol Generation. Our keys are Italian phrases, often
        # differing only by case («Corpi»/«corpi») or containing only placeholders («%@ %lld»):
        # Xcode cannot derive unique Swift symbols, and we look strings up with String(localized:).
        # The version stamp below reads .git: outside the script sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Xcode keeps Localizable.xcstrings in step with the SwiftUI strings in the code:
        # every Text/Label/Button literal is extracted, and missing translations show up in
        # the catalog as «new» (docs/UI_LIQUID_GLASS_AND_I18N_SPEC.md).
        SWIFT_EMIT_LOC_STRINGS: YES
    # Git commit and build time into the built Info.plist, shown in the status bar and Home, so
    # anyone can check they run the latest version (a "+" marks uncommitted changes).
    postBuildScripts:
      - name: Stamp version
        basedOnDependencyAnalysis: false
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          commit=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo "sconosciuto")
          if [ -n "$(git -C "$SRCROOT" status --porcelain --untracked-files=no 2>/dev/null)" ]; then commit="$commit+"; fi
          stamp=$(date "+%Y-%m-%d %H:%M")
          # Version = MARKETING_VERSION's major.minor + the commits since the series began: every
          # change committed is +1 (1.0.0 → 1.0.1), never edited by hand.
          count=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo 0)
          version="$(echo "$MARKETING_VERSION" | cut -d. -f1-2).$(( count - ${FTK_SERIES_START:-0} ))"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$plist"
          for pair in "FTKCommit:$commit" "FTKBuildDate:$stamp"; do
            key=${pair%%:*}; value=${pair#*:}
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :$key string $value" "$plist"
          done
    scheme:
      testTargets: []
  ftk-mcp:
    type: tool
    platform: macOS
    sources:
      - Tools/ftk-mcp
    settings:
      base:
        PRODUCT_NAME: ftk-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.takeoff.fusiontakeoff.ftk-mcp
        CODE_SIGN_ENTITLEMENTS: Tools/ftk-mcp.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
