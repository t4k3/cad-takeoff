# Source of truth for the Xcode project. Regenerate with: xcodegen generate
# Do NOT hand-edit FusionTakeoff.xcodeproj — edit this file instead.
name: FusionTakeoff
options:
  bundleIdPrefix: com.takeoff
  deploymentTarget:
    # macOS 27 and later (Ross, 27/09): the newest Foundation Models, Liquid Glass, Metal 4.
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Written by .githooks/pre-commit at every commit: major.minor stay as set here, the last
    # number counts the commits since the series began (also stamped into the built app).
    # New series (Ross, 27/09: 1.0.0 with «Circuiti»): set major.minor here and FTK_SERIES_START
    # to the commit count the series' first commit will have (git rev-list --count HEAD + 1).
    MARKETING_VERSION: "1.0.25"
    FTK_SERIES_START: "164"
    CURRENT_PROJECT_VERSION: "1"
    # Signed with Ross's Apple Development identity (team 9F8D583GBV): needed for the
    # App Group shared by the app and the ftk-mcp bridge. For TestFlight, archive in Xcode
    # with automatic signing (Distribution).
    DEVELOPMENT_TEAM: 9F8D583GBV
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
packages:
  CADCore:
    path: Packages/CADCore
  # «Circuiti»: the electronics engine (Codex, docs/electronics).
  ElectronicsCore:
    path: Packages/ElectronicsCore
targets:
  FusionTakeoff:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: CADCore
      - package: ElectronicsCore
        product: ElectronicsCore
      # MCP bridge shipped inside the app: Contents/MacOS/ftk-mcp (Claude Desktop, ChatGPT tunnel).
      - target: ftk-mcp
        embed: true
        codeSign: false
        copy:
          destination: executables
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CAD Takeoff
        CFBundleName: CAD Takeoff
        # Version and build come from the build settings (the archive script sets the build number).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.graphics-design
        # Only standard HTTPS (Anthropic/OpenAI APIs) and a localhost MCP server: exempt.
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 CAD Takeoff"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.takeoff.fusiontakeoff.design
            UTTypeDescription: CAD Takeoff Design
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [ftk]
          - UTTypeIdentifier: com.takeoff.fusiontakeoff.circuit
            UTTypeDescription: CAD Takeoff Circuito
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [ftkc]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takeoff.fusiontakeoff
        CODE_SIGN_ENTITLEMENTS: App/FusionTakeoff.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The version stamp below reads .git: outside the script sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Git commit and build time into the built Info.plist, shown in the status bar and Home, so
    # anyone can check they run the latest version (a "+" marks uncommitted changes).
    postBuildScripts:
      - name: Stamp version
        basedOnDependencyAnalysis: false
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          commit=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo "sconosciuto")
          if [ -n "$(git -C "$SRCROOT" status --porcelain --untracked-files=no 2>/dev/null)" ]; then commit="$commit+"; fi
          stamp=$(date "+%Y-%m-%d %H:%M")
          # Version = MARKETING_VERSION's major.minor + the commits since the series began: every
          # change committed is +1 (1.0.0 → 1.0.1), never edited by hand.
          count=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo 0)
          version="$(echo "$MARKETING_VERSION" | cut -d. -f1-2).$(( count - ${FTK_SERIES_START:-0} ))"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$plist"
          for pair in "FTKCommit:$commit" "FTKBuildDate:$stamp"; do
            key=${pair%%:*}; value=${pair#*:}
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :$key string $value" "$plist"
          done
    scheme:
      testTargets: []
  ftk-mcp:
    type: tool
    platform: macOS
    sources:
      - Tools/ftk-mcp
    settings:
      base:
        PRODUCT_NAME: ftk-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.takeoff.fusiontakeoff.ftk-mcp
        CODE_SIGN_ENTITLEMENTS: Tools/ftk-mcp.entitlements
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
